name: Jenkins REST CI Build
run-name: ${{ github.actor }} is running Jenkins REST CI Build on GitHub Actions 🚀
on: [ push, pull_request_target ]
permissions:
  checks: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 Triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 Running on ${{ runner.os }}!"
      - run: echo "🔎 Branch is ${{ github.head_ref || github.ref }} in ${{ github.repository }}."

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - run: echo "💡 Sources cloned to $GITHUB_WORKSPACE."

      - name: Build Jenkins LTS Docker image
        run: docker build -t jenkins-rest/jenkins src/main/docker

      - name: Run Jenkins LTS container
        run: docker run -d --rm -p 8080:8080 --name jenkins-rest jenkins-rest/jenkins

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: ${{ github.workspace }}/build/reports/jacoco/test/html

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@v5.0
        with:
          coverage_results_path: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Get the Coverage info
        run: |
          echo "Total coverage: ${{ steps.jacoco_reporter.outputs.coverage-overall }}"
          echo "Changed-files coverage: ${{ steps.jacoco_reporter.outputs.coverage-changed-files }}"
          echo "Overall %: ${{ steps.jacoco_reporter.outputs.coveragePercentage }}"
          echo "Percentage String: ${{ steps.jacoco_reporter.outputs.coveragePercentageString }}"

      - name: Add Coverage Job Summary
        run: echo "${{ steps.jacoco_reporter.outputs.coverageSummary }}" >> $GITHUB_STEP_SUMMARY

      - name: Stop Jenkins container
        run: docker stop jenkins-rest
